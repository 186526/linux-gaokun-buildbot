name: Build Image - Fedora Gaokun3

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful package CI run to use (empty searches releases)
        required: false
        type: string
      publish_release:
        description: Publish the image as a GitHub release
        required: false
        default: false
        type: boolean
      fedora_release:
        description: Fedora release version (e.g. 44)
        required: true
        default: "44"
      kernel_tag:
        description: Linux kernel tag (XanMod uses the real tag, e.g. 7.2.9-xanmod1)
        required: true
        default: "7.2.9-xanmod1"
      kernel_base:
        description: Kernel base (mainline or xanmod)
        required: true
        default: "xanmod"
        type: choice
        options:
          - mainline
          - xanmod
      desktop_environment:
        description: Desktop environment packages or groups (space-separated)
        required: true
        default: "@gnome-desktop @workstation-product"
      excluded_packages:
        description: Packages to exclude from rootfs install (comma-separated)
        required: true
        default: "gnome-boxes,gnome-connections,snapshot,gnome-weather,gnome-contacts,gnome-maps,simple-scan,gnome-clocks,gnome-calculator,gnome-calendar,amd-gpu-firmware,intel-gpu-firmware,linux-firmware,nvidia-gpu-firmware,toolbox,unoconv,mediawriter"
      extra_packages:
        description: Extra packages to install (space-separated)
        required: true
        default: "fcitx5-chinese-addons gnome-tweaks gnome-extensions-app telnet mpv v4l-utils vim nano ripgrep git htop fastfetch screen firefox"
      build_el2:
        description: Build and include optional -gaokun3-el2 kernel and EL2 EFI payloads
        required: true
        default: true
        type: boolean
      build_kernelsu:
        description: Build and include KernelSU support in the kernel packages
        required: true
        default: true
        type: boolean
      kernel_toolchain:
        description: Kernel toolchain (clang default for Clang/LLVM + ThinLTO; gcc for the portable baseline)
        required: true
        default: "clang"
        type: choice
        options:
          - gcc
          - clang
      kernel_tune:
        description: >-
          Target tuning; the SC8280XP profile (sc8280xp / 8cx-gen3 / 8cxgen3)
          selects -march=armv8.4-a+crypto -mtune=cortex-x1c, other values select
          -mtune=<cpu> only, empty keeps the portable baseline (default sc8280xp)
        required: false
        default: "sc8280xp"
        type: string
      rebuild_package_rpms:
        description: Rebuild gaokun package RPMs before image build
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build-package-rpms:
    if: ${{ github.event.inputs.rebuild_package_rpms == 'true' }}
    uses: ./.github/workflows/gaokun3-package-rpms.yml
    with:
      kernel_tag: ${{ github.event.inputs.kernel_tag }}
      kernel_base: ${{ github.event.inputs.kernel_base }}
      build_el2: ${{ github.event.inputs.build_el2 == 'true' }}
      build_kernelsu: ${{ github.event.inputs.build_kernelsu == 'true' }}
      kernel_toolchain: ${{ github.event.inputs.kernel_toolchain }}
      kernel_tune: ${{ github.event.inputs.kernel_tune }}
    secrets: inherit

  build-and-release:
    needs: build-package-rpms
    if: ${{ !cancelled() && (needs.build-package-rpms.result == 'success' || needs.build-package-rpms.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      TZ: UTC
      FEDORA_RELEASE: ${{ github.event.inputs.fedora_release }}
      KERNEL_TAG: ${{ github.event.inputs.kernel_tag }}
      KERNEL_BASE: ${{ github.event.inputs.kernel_base }}
      DESKTOP_ENVIRONMENT: ${{ github.event.inputs.desktop_environment }}
      EXCLUDED_PACKAGES: ${{ github.event.inputs.excluded_packages }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
      BUILD_EL2: ${{ github.event.inputs.build_el2 }}
      BUILD_KERNELSU: ${{ github.event.inputs.build_kernelsu }}
      KERNEL_TOOLCHAIN: ${{ github.event.inputs.kernel_toolchain }}
      KERNEL_TUNE: ${{ github.event.inputs.kernel_tune }}
      IMAGE_SIZE: 12G
      IMAGE_CHUNK_SIZE: 1900M
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-fedora
      ROOTFS_DIR: ${{ github.workspace }}/build-fedora/rootfs
      ARTIFACT_DIR: ${{ github.workspace }}/build-fedora/artifacts
      PACKAGE_RPMS_DIR: ${{ github.workspace }}/build-fedora/package-rpms

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load reviewed build inputs
        run: |
          set -euo pipefail
          # EL2 is patch-based (scripts/ci/20_build_kernel_variants.sh applies
          # patches/el2), so BUILD_EL2=true no longer requires KERNEL_EL2_COMMIT;
          # build.env leaves it empty by design.
          #
          # The requested dispatch label is authoritative: build.env's KERNEL_TAG
          # is only the local-build default (gaokun3), so preserve the tag the
          # caller asked for instead of exporting build.env's value over it. The
          # package release is located by that label, and a manifest whose
          # kernel_tag differs is rejected below.
          requested_kernel_tag="${KERNEL_TAG:-}"
          . ./build.env
          if [[ -n "$requested_kernel_tag" ]]; then
            KERNEL_TAG="$requested_kernel_tag"
          fi
          for name in KERNEL_REPOSITORY KERNEL_TAG KERNEL_COMMIT KERNEL_EL2_COMMIT FEDORA_RELEASE UBUNTU_RELEASE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          echo "IMAGE_FILE=$WORKDIR/fedora-${FEDORA_RELEASE}-gaokun3.img" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            rsync kmod curl jq \
            parted dosfstools e2fsprogs zstd xz-utils python3

      - name: Prepare build workspace
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ROOTFS_DIR" "$ARTIFACT_DIR"

      - name: Resolve package release tag
        if: inputs.package_run_id == '' && !inputs.rebuild_package_rpms
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          if [[ "${{ github.event.inputs.rebuild_package_rpms }}" == "true" ]]; then
            package_release_tag="${{ needs.build-package-rpms.outputs.package_release_tag }}"
          else
            safe_kernel_tag="${KERNEL_TAG//\//-}"
            safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
            base_suffix=""
            if [[ "${KERNEL_BASE:-xanmod}" == "xanmod" ]]; then
              base_suffix="-xanmod"
            fi
            profile="std"
            if [[ "$BUILD_EL2" == "true" ]]; then
              profile="${profile}-el2"
            fi
            if [[ "$BUILD_KERNELSU" == "true" ]]; then
              profile="${profile}-ksu"
            fi
            toolchain_suffix=""
            if [[ "${KERNEL_TOOLCHAIN:-gcc}" == "clang" ]]; then
              toolchain_suffix="-clang"
            fi
            prefix="gaokun3-rpms-${safe_kernel_tag}${base_suffix}-${profile}${toolchain_suffix}-"

          releases_json="$WORKDIR/releases.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -o "$releases_json"

            package_release_tag="$(jq -r --arg prefix "$prefix" '[.[] | .tag_name | select(startswith($prefix)) | select((ltrimstr($prefix)) | test("^[0-9]{14}$"))] | first // empty' "$releases_json")"
            if [[ -z "$package_release_tag" ]]; then
              echo "no package release found for prefix ${prefix}" >&2
              exit 1
            fi
          fi

          echo "PACKAGE_RELEASE_TAG=$package_release_tag" >> "$GITHUB_ENV"

      - name: Download gaokun package RPMs
        if: inputs.package_run_id == '' && !inputs.rebuild_package_rpms
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$PACKAGE_RPMS_DIR"

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${PACKAGE_RELEASE_TAG}"
          release_json="$WORKDIR/package-release.json"

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api_url" \
            -o "$release_json"

          asset_name="package-manifest.json"
          asset_url="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .url' "$release_json")"

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "missing asset ${asset_name} in release ${PACKAGE_RELEASE_TAG}" >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$asset_url" \
            -o "$PACKAGE_RPMS_DIR/$asset_name"

          manifest_path="$PACKAGE_RPMS_DIR/package-manifest.json"
          manifest_kernel_tag="$(jq -r '.kernel_tag' "$manifest_path")"
          manifest_build_el2="$(jq -r '.build_el2' "$manifest_path")"
          manifest_build_kernelsu="$(jq -r '.build_kernelsu' "$manifest_path")"

          if [[ "$manifest_kernel_tag" != "$KERNEL_TAG" ]]; then
            echo "package release kernel tag mismatch: expected ${KERNEL_TAG}, got ${manifest_kernel_tag}" >&2
            exit 1
          fi

          if [[ "$BUILD_EL2" == "true" && "$manifest_build_el2" != "true" ]]; then
            echo "package release ${PACKAGE_RELEASE_TAG} does not contain EL2 packages" >&2
            exit 1
          fi

          if [[ "$BUILD_KERNELSU" == "true" && "$manifest_build_kernelsu" != "true" ]]; then
            echo "package release ${PACKAGE_RELEASE_TAG} does not contain KernelSU support" >&2
            exit 1
          fi

          asset_names=(
            "$(jq -r '.kernels.standard.packages.kernel' "$manifest_path")"
            "$(jq -r '.kernels.standard.packages.kernel_modules' "$manifest_path")"
            "$(jq -r '.packages.firmware' "$manifest_path")"
          )

          if [[ "$BUILD_EL2" == "true" ]]; then
            asset_names+=(
              "$(jq -r '.kernels.el2.packages.kernel' "$manifest_path")"
              "$(jq -r '.kernels.el2.packages.kernel_modules' "$manifest_path")"
            )
          fi

          for asset_name in "${asset_names[@]}"; do
            asset_url="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .url' "$release_json")"

            if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
              echo "missing asset ${asset_name} in release ${PACKAGE_RELEASE_TAG}" >&2
              exit 1
            fi

            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "$asset_url" \
              -o "$PACKAGE_RPMS_DIR/$asset_name"
          done

      - name: Download package CI artifacts
        if: inputs.package_run_id != '' || inputs.rebuild_package_rpms
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name gaokun3-package-rpms --dir "$PACKAGE_RPMS_DIR"

      - name: Check package inputs
        run: |
          set -euo pipefail
          manifest_path="$PACKAGE_RPMS_DIR/package-manifest.json"
          manifest_kernel_tag="$(jq -r '.kernel_tag' "$manifest_path")"
          manifest_build_el2="$(jq -r '.build_el2' "$manifest_path")"
          manifest_kernel_commit="$(jq -r '.kernel_commit' "$manifest_path")"
          # build.env pins the mainline commit; an XanMod build records the
          # commit it resolved from KERNEL_XANMOD_TAG instead, so the pin check
          # only applies to kernel_base=mainline. The kernel_tag check below
          # still ties the package set to the requested label for both bases.
          if [[ "${KERNEL_BASE:-xanmod}" != "xanmod" && "$manifest_kernel_commit" != "$KERNEL_COMMIT" ]]; then
            echo "Package source commit does not match build.env; rebuild the packages." >&2
            exit 1
          fi

          if [[ "$manifest_kernel_tag" != "$KERNEL_TAG" ]]; then
            echo "package release kernel tag mismatch: expected ${KERNEL_TAG}, got ${manifest_kernel_tag}" >&2
            exit 1
          fi

          if [[ "$BUILD_EL2" == "true" && "$manifest_build_el2" != "true" ]]; then
            echo "Selected packages do not contain the requested EL2 kernel" >&2
            exit 1
          fi

      - name: Bootstrap Fedora rootfs and install packages
        env:
          PACKAGE_SET: >-
            @core @standard ${{ inputs.desktop_environment }}
            systemd-boot-unsigned alsa-ucm policycoreutils selinux-policy-targeted
            NetworkManager NetworkManager-wifi NetworkManager-tui openssh-server
            gdm gnome-initial-setup glibc-langpack-en langpacks-en langpacks-zh_CN binutils
            google-noto-color-emoji-fonts google-noto-emoji-fonts
            alsa-utils pipewire-utils
          INSTALL_LANGS: all
          ENABLE_RPMFUSION: "true"
        run: |
          set -euo pipefail
          jq -r '.kernels.standard.release' "$PACKAGE_RPMS_DIR/package-manifest.json" > "$WORKDIR/kernel-release.txt"
          if [[ "$BUILD_EL2" == true ]]; then
            jq -r '.kernels.el2.release' "$PACKAGE_RPMS_DIR/package-manifest.json" > "$WORKDIR/kernel-release-el2.txt"
          fi
          bash scripts/ci/30_bootstrap_rootfs.sh

      - name: Create disk image and configure boot
        run: |
          chmod +x scripts/ci/50_make_image_fedora.sh
          scripts/ci/50_make_image_fedora.sh

      - name: Package image and generate release info
        id: package
        run: |
          chmod +x scripts/ci/60_package_release_fedora.sh
          scripts/ci/60_package_release_fedora.sh
          TAG_NAME="$(cat "$WORKDIR/tag-name.txt")"
          KREL="$(cat "$WORKDIR/kernel-release-export.txt")"
          PACKAGE_GLOB="$(cat "$WORKDIR/package-glob.txt")"
          RELEASE_BODY_FILE="$(cat "$WORKDIR/release-body-file.txt")"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "kernel_release=$KREL" >> "$GITHUB_OUTPUT"
          echo "package_glob=$PACKAGE_GLOB" >> "$GITHUB_OUTPUT"
          echo "release_body_file=$RELEASE_BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: fedora-gaokun3-build
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.package.outputs.artifact_dir }}/${{ steps.package.outputs.package_glob }}
            ${{ steps.package.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.package.outputs.artifact_dir }}/release-body.md

      - name: Create GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: Fedora Linux ${{ env.FEDORA_RELEASE }} - gaokun3 - ${{ steps.package.outputs.kernel_release }}
          body_path: ${{ steps.package.outputs.artifact_dir }}/${{ steps.package.outputs.release_body_file }}
          files: |
            ${{ steps.package.outputs.artifact_dir }}/${{ steps.package.outputs.package_glob }}
            ${{ steps.package.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.package.outputs.artifact_dir }}/release-body.md
