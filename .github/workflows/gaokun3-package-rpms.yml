name: Build Package - RPMs Gaokun3

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2-rc2"
      kernel_base:
        description: Kernel base (mainline or xanmod)
        required: true
        default: "mainline"
        type: choice
        options:
          - mainline
          - xanmod
      publish_release:
        description: Publish packages as a GitHub release
        required: false
        default: false
        type: boolean
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: true
        default: false
        type: boolean
      build_kernelsu:
        description: Build KernelSU support into the kernel packages
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: false
        default: "v7.2-rc2"
        type: string
      kernel_base:
        description: Kernel base (mainline or xanmod)
        required: false
        default: "mainline"
        type: string
      publish_release:
        description: Publish packages as a GitHub release
        required: false
        default: false
        type: boolean
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: false
        default: false
        type: boolean
      build_kernelsu:
        description: Build KernelSU support into the kernel packages
        required: false
        default: false
        type: boolean
    outputs:
      package_release_tag:
        description: Release tag containing the generated package bundle
        value: ${{ jobs.build-package-rpms.outputs.package_release_tag }}

permissions:
  contents: write

jobs:
  build-package-rpms:
    outputs:
      package_release_tag: ${{ steps.release_meta.outputs.package_release_tag }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
      KERNEL_TAG: ${{ inputs.kernel_tag || github.event.inputs.kernel_tag }}
      KERNEL_BASE: ${{ inputs.kernel_base || github.event.inputs.kernel_base || 'mainline' }}
      BUILD_EL2: ${{ inputs.build_el2 || github.event.inputs.build_el2 || 'false' }}
      BUILD_KERNELSU: ${{ inputs.build_kernelsu || github.event.inputs.build_kernelsu || 'false' }}
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-packages
      KERN_SRC: ${{ github.workspace }}/build-packages/kernel-src
      KERN_SRC_BASE: ${{ github.workspace }}/build-packages/kernel-src-base
      KERN_OUT: ${{ github.workspace }}/build-packages/kernel-out
      KERN_OUT_EL2: ${{ github.workspace }}/build-packages/kernel-out-el2
      EL2_SRC: ${{ github.workspace }}/build-packages/linux-el2
      ARTIFACT_DIR: ${{ github.workspace }}/build-packages/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load reviewed build inputs
        run: |
          set -euo pipefail
          . ./build.env
          echo "BUILDBOT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ "$BUILD_EL2" == true && -z "$KERNEL_EL2_COMMIT" ]]; then
            echo 'EL2 migration is not ready: KERNEL_EL2_COMMIT is unset.' >&2
            exit 1
          fi
          for name in KERNEL_REPOSITORY KERNEL_TAG KERNEL_COMMIT KERNEL_EL2_COMMIT FEDORA_RELEASE UBUNTU_RELEASE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Checkout Linux source
        run: |
          set -euxo pipefail
          # KERNEL_TAG names the artifacts only; the reviewed KERNEL_COMMIT in
          # build.env is the commit fetched from KERNEL_REPOSITORY.
          # shellcheck source=scripts/lib/kernel_source.sh
          . ./scripts/lib/kernel_source.sh
          prepare_kernel_source "$KERN_SRC" "$KERNEL_COMMIT"

      - name: Checkout EL2 Linux source
        if: env.BUILD_EL2 == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KERNEL_REPOSITORY }}
          ref: ${{ env.KERNEL_EL2_COMMIT }}
          fetch-depth: 1
          path: build-packages/linux-el2

      - name: Pin the EL2 source path
        if: env.BUILD_EL2 == 'true'
        run: echo "KERN_SRC_EL2=$EL2_SRC" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev dwarves ccache

      - name: Resolve package release tag
        id: release_meta
        run: |
          set -euxo pipefail
          safe_kernel_tag="${KERNEL_TAG//\//-}"
          safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
          base_suffix=""
          if [[ "${KERNEL_BASE:-mainline}" == "xanmod" ]]; then
            base_suffix="-xanmod"
          fi
          profile="std"
          if [[ "$BUILD_EL2" == "true" ]]; then
            profile="${profile}-el2"
          fi
          if [[ "$BUILD_KERNELSU" == "true" ]]; then
            profile="${profile}-ksu"
          fi
          package_release_tag="gaokun3-rpms-${safe_kernel_tag}${base_suffix}-${profile}-$(date -u +%Y%m%d%H%M%S)"

          echo "package_release_tag=$package_release_tag" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_RELEASE_TAG=$package_release_tag" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: gaokun3-packages-rpm-ccache-${{ env.KERNEL_BASE }}-${{ env.KERNEL_TAG }}-${{ env.BUILD_EL2 }}-${{ env.BUILD_KERNELSU }}-${{ hashFiles('patches/*.patch', 'patches/**/*.patch', 'patches/el2/*.patch', 'patches/kernelsu/**', 'defconfig/**', 'dts/**', 'drivers/**', 'packaging/**', 'firmware/**', 'scripts/ci/*.sh', 'scripts/ci/lib/*.sh', '.github/workflows/gaokun3-package-rpms.yml') }}
          restore-keys: |
            gaokun3-packages-rpm-ccache-${{ env.KERNEL_BASE }}-${{ env.KERNEL_TAG }}-
            gaokun3-packages-rpm-ccache-

      - name: Build gaokun kernel variants
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ARTIFACT_DIR"
          chmod +x scripts/ci/20_build_kernel_variants.sh
          scripts/ci/20_build_kernel_variants.sh

      - name: Build RPM packages
        run: |
          sudo docker run --rm \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e GAOKUN_DIR="$GAOKUN_DIR" \
            -e WORKDIR="$WORKDIR" \
            -e KERN_SRC="$KERN_SRC" \
            -e KERN_OUT="$KERN_OUT" \
            -e KERN_SRC_BASE="$KERN_SRC_BASE" \
            -e KERN_SRC_EL2="$KERN_SRC_EL2" \
            -e KERN_OUT_EL2="$KERN_OUT_EL2" \
            -e ARTIFACT_DIR="$ARTIFACT_DIR" \
            -e KERNEL_TAG="$KERNEL_TAG" \
            -e KERNEL_COMMIT="$KERNEL_COMMIT" \
            -e BUILDBOT_COMMIT="$BUILDBOT_COMMIT" \
            -e PACKAGE_RELEASE_TAG="$PACKAGE_RELEASE_TAG" \
            -e BUILD_EL2="$BUILD_EL2" \
            -e BUILD_KERNELSU="$BUILD_KERNELSU" \
            --user root \
            "fedora:${FEDORA_RELEASE}" \
            bash -euxo pipefail -c '
              dnf -y install git gcc make rpm-build kmod elfutils-libelf-devel tar gzip rsync
              chmod +x scripts/ci/70_build_package_rpms.sh
              scripts/ci/70_build_package_rpms.sh
            '

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: gaokun3-package-rpms
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ARTIFACT_DIR }}/*.rpm
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
            ${{ env.ARTIFACT_DIR }}/package-release-body.md

      - name: Publish package release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.release_meta.outputs.package_release_tag }}
          name: gaokun3 package RPMs - ${{ env.KERNEL_TAG }}${{ env.KERNEL_BASE == 'xanmod' && ' (XanMod)' || '' }}${{ env.BUILD_EL2 == 'true' && ' + EL2' || '' }}${{ env.BUILD_KERNELSU == 'true' && ' + KernelSU' || '' }}
          body_path: ${{ env.ARTIFACT_DIR }}/package-release-body.md
          prerelease: false
          make_latest: false
          append_body: false
          overwrite_files: true
          files: |
            ${{ env.ARTIFACT_DIR }}/*.rpm
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
