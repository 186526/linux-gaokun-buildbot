name: Build Package - DEBs Gaokun3

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2-rc2"
      kernel_base:
        description: Kernel base (mainline or xanmod)
        required: true
        default: "mainline"
        type: choice
        options:
          - mainline
          - xanmod
      publish_release:
        description: Publish packages as a GitHub release
        required: false
        default: false
        type: boolean
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: true
        default: false
        type: boolean
      build_kernelsu:
        description: Build KernelSU support into the kernel packages
        required: true
        default: false
        type: boolean
      kernel_toolchain:
        description: Kernel toolchain (gcc default, or clang for Clang/LLVM + ThinLTO)
        required: true
        default: "gcc"
        type: choice
        options:
          - gcc
          - clang
      kernel_tune:
        description: >-
          Opt-in target tuning; the SC8280XP profile (sc8280xp / 8cx-gen3 /
          8cxgen3) selects -march=armv8.4-a+crypto -mtune=cortex-x1c, other
          values select -mtune=<cpu> only, empty keeps the portable baseline
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: false
        default: "v7.2-rc2"
        type: string
      kernel_base:
        description: Kernel base (mainline or xanmod)
        required: false
        default: "mainline"
        type: string
      publish_release:
        description: Publish packages as a GitHub release
        required: false
        default: false
        type: boolean
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: false
        default: false
        type: boolean
      build_kernelsu:
        description: Build KernelSU support into the kernel packages
        required: false
        default: false
        type: boolean
      kernel_toolchain:
        description: Kernel toolchain (gcc default, or clang for Clang/LLVM + ThinLTO)
        required: false
        default: "gcc"
        type: string
      kernel_tune:
        description: >-
          Opt-in target tuning; the SC8280XP profile (sc8280xp / 8cx-gen3 /
          8cxgen3) selects -march=armv8.4-a+crypto -mtune=cortex-x1c, other
          values select -mtune=<cpu> only, empty keeps the portable baseline
        required: false
        default: ""
        type: string
    outputs:
      package_release_tag:
        description: Release tag containing the generated package bundle
        value: ${{ jobs.build-package-debs.outputs.package_release_tag }}

permissions:
  contents: write

jobs:
  build-package-debs:
    outputs:
      package_release_tag: ${{ steps.release_meta.outputs.package_release_tag }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
      KERNEL_TAG: ${{ inputs.kernel_tag || github.event.inputs.kernel_tag }}
      KERNEL_BASE: ${{ inputs.kernel_base || github.event.inputs.kernel_base || 'mainline' }}
      BUILD_EL2: ${{ inputs.build_el2 || github.event.inputs.build_el2 || 'false' }}
      BUILD_KERNELSU: ${{ inputs.build_kernelsu || github.event.inputs.build_kernelsu || 'false' }}
      KERNEL_TOOLCHAIN: ${{ inputs.kernel_toolchain || github.event.inputs.kernel_toolchain || 'gcc' }}
      KERNEL_TUNE: ${{ inputs.kernel_tune || github.event.inputs.kernel_tune || '' }}
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-packages
      KERN_SRC: ${{ github.workspace }}/build-packages/kernel-src
      KERN_SRC_BASE: ${{ github.workspace }}/build-packages/kernel-src-base
      KERN_SRC_EL2: ${{ github.workspace }}/build-packages/kernel-src
      KERN_OUT: ${{ github.workspace }}/build-packages/kernel-out
      KERN_OUT_EL2: ${{ github.workspace }}/build-packages/kernel-out-el2
      KERNEL_XANMOD_TAG: "7.2.9-xanmod1"
      ARTIFACT_DIR: ${{ github.workspace }}/build-packages/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load reviewed build inputs
        run: |
          set -euo pipefail
          # The requested dispatch label is authoritative for artifact naming.
          # build.env pins the source inputs, but its KERNEL_TAG is only the
          # local-build default (gaokun3); sourcing it here must not clobber the
          # tag the caller asked for. The image workflows locate the package
          # release by that tag (gaokun3-debs-<tag>-<base>-<profile>-<ts>) and
          # reject a manifest whose kernel_tag differs, so the requested label
          # has to survive.
          requested_kernel_tag="${KERNEL_TAG:-}"
          . ./build.env
          if [[ -n "$requested_kernel_tag" ]]; then
            KERNEL_TAG="$requested_kernel_tag"
          fi
          # XanMod source is always cloned at KERNEL_XANMOD_TAG, so the naming
          # label must equal it; otherwise the manifest would misdescribe the
          # cloned tree and the image workflows could not match the release.
          if [[ "${KERNEL_BASE:-mainline}" == "xanmod" && "$KERNEL_TAG" != "$KERNEL_XANMOD_TAG" ]]; then
            echo "kernel_tag ${KERNEL_TAG} must equal KERNEL_XANMOD_TAG ${KERNEL_XANMOD_TAG} when kernel_base=xanmod" >&2
            exit 1
          fi
          echo "BUILDBOT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for name in KERNEL_REPOSITORY KERNEL_TAG KERNEL_COMMIT KERNEL_EL2_COMMIT FEDORA_RELEASE UBUNTU_RELEASE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Prepare Linux source
        run: |
          set -euxo pipefail
          # mainline uses the reviewed KERNEL_COMMIT pinned in build.env. XanMod
          # is a gitlab.com tree that the github-only helper cannot fetch, so it
          # is cloned by its real tag (KERNEL_XANMOD_TAG) and the resolved commit
          # is recorded for the manifest. KERNEL_TAG is the requested naming
          # label, validated against KERNEL_XANMOD_TAG in the previous step.
          # The xanmod tree is intentionally not checked for gaokun3_defconfig:
          # that file is created by patches/0099, which 20_build_kernel_variants.sh
          # applies later, so it is absent from the freshly cloned tag.
          # shellcheck source=scripts/lib/kernel_source.sh
          . ./scripts/lib/kernel_source.sh
          if [[ "${KERNEL_BASE:-mainline}" == "xanmod" ]]; then
            if [[ -d "$KERN_SRC" ]]; then
              echo "KERN_SRC $KERN_SRC already exists; refusing to re-clone" >&2
              exit 1
            fi
            mkdir -p "$KERN_SRC"
            git -C "$KERN_SRC" init -q
            git -C "$KERN_SRC" remote add origin "https://gitlab.com/xanmod/linux.git"
            git -C "$KERN_SRC" fetch --depth=1 origin "$KERNEL_XANMOD_TAG"
            git -C "$KERN_SRC" checkout --detach FETCH_HEAD
            KERNEL_COMMIT="$(git -C "$KERN_SRC" rev-parse HEAD)"
            echo "KERNEL_COMMIT=$KERNEL_COMMIT" >> "$GITHUB_ENV"
          else
            prepare_kernel_source "$KERN_SRC" "$KERNEL_COMMIT"
          fi

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev dwarves ccache dpkg-dev
          if [[ "${KERNEL_TOOLCHAIN:-gcc}" == "clang" ]]; then
            # LLVM=1 builds arm64 with clang, ld.lld, llvm-ar, llvm-nm and
            # llvm-objcopy; ThinLTO needs ld.lld specifically.
            sudo apt-get install -y clang lld llvm
            clang --version
            ld.lld --version
          fi

      - name: Resolve package release tag
        id: release_meta
        run: |
          set -euxo pipefail
          safe_kernel_tag="${KERNEL_TAG//\//-}"
          safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
          base_suffix=""
          if [[ "${KERNEL_BASE:-mainline}" == "xanmod" ]]; then
            base_suffix="-xanmod"
          fi
          profile="std"
          if [[ "$BUILD_EL2" == "true" ]]; then
            profile="${profile}-el2"
          fi
          if [[ "$BUILD_KERNELSU" == "true" ]]; then
            profile="${profile}-ksu"
          fi
          # GCC builds keep their existing tag shape; only Clang builds add the
          # suffix, so image workflows can tell the two toolchains apart.
          toolchain_suffix=""
          if [[ "${KERNEL_TOOLCHAIN:-gcc}" == "clang" ]]; then
            toolchain_suffix="-clang"
          fi
          package_release_tag="gaokun3-debs-${safe_kernel_tag}${base_suffix}-${profile}${toolchain_suffix}-$(date -u +%Y%m%d%H%M%S)"

          echo "package_release_tag=$package_release_tag" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_RELEASE_TAG=$package_release_tag" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: gaokun3-packages-deb-ccache-${{ env.KERNEL_BASE }}-${{ env.KERNEL_TAG }}-${{ env.KERNEL_TOOLCHAIN }}-${{ env.BUILD_EL2 }}-${{ env.BUILD_KERNELSU }}-${{ hashFiles('patches/*.patch', 'patches/**/*.patch', 'patches/el2/*.patch', 'patches/kernelsu/**', 'defconfig/**', 'dts/**', 'drivers/**', 'packaging/**', 'firmware/**', 'scripts/ci/*.sh', 'scripts/ci/lib/*.sh', '.github/workflows/gaokun3-package-debs.yml') }}
          restore-keys: |
            gaokun3-packages-deb-ccache-${{ env.KERNEL_BASE }}-${{ env.KERNEL_TAG }}-${{ env.KERNEL_TOOLCHAIN }}-
            gaokun3-packages-deb-ccache-

      - name: Build gaokun kernel variants
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ARTIFACT_DIR"
          chmod +x scripts/ci/20_build_kernel_variants.sh
          scripts/ci/20_build_kernel_variants.sh

      - name: Build DEB packages
        run: |
          chmod +x scripts/ci/70_build_package_debs.sh
          scripts/ci/70_build_package_debs.sh

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: gaokun3-package-debs
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ARTIFACT_DIR }}/*.deb
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
            ${{ env.ARTIFACT_DIR }}/package-release-body.md

      - name: Publish package release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.release_meta.outputs.package_release_tag }}
          name: gaokun3 package DEBs - ${{ env.KERNEL_TAG }}${{ env.KERNEL_BASE == 'xanmod' && ' (XanMod)' || '' }}${{ env.BUILD_EL2 == 'true' && ' + EL2' || '' }}${{ env.BUILD_KERNELSU == 'true' && ' + KernelSU' || '' }}${{ env.KERNEL_TOOLCHAIN == 'clang' && ' + Clang ThinLTO' || '' }}
          body_path: ${{ env.ARTIFACT_DIR }}/package-release-body.md
          prerelease: false
          make_latest: false
          append_body: false
          overwrite_files: true
          files: |
            ${{ env.ARTIFACT_DIR }}/*.deb
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
