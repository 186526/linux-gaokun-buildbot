# Gaokun3 uses the standard SC8280XP routes with a board-specific gain policy.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sc8280xp/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='SpkrLeft PA Volume' 29"
	cset "name='SpkrRight PA Volume' 29"
	cset "name='HPHL Volume' 2"
	cset "name='HPHR Volume' 2"
	cset "name='ADC2 Volume' 10"
]

# Reapply the chosen boot default even when alsactl restores older mixer state.
# Digital remains at unity. PA +18 dB is downstream tuning, not calibrated
# speaker protection. Desktop volume remains under user control.
FixedBootSequence [
	cset "name='WSA_RX0 Digital Volume' 84"
	cset "name='WSA_RX1 Digital Volume' 84"
	cset "name='SpkrLeft PA Volume' 29"
	cset "name='SpkrRight PA Volume' 29"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa883x/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
